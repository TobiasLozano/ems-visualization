<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .side-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12px; }
      .tbl-head { rx: 6px; }
      .tbl-head-curr { fill: #0284c7; }
      .tbl-head-prop { fill: #059669; }
      .tbl-body { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .head-title { fill: #ffffff; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .col-pk { fill: #b45309; font-family: monospace; font-size: 11px; font-weight: 700; }
      .col-idx { fill: #0284c7; font-family: monospace; font-size: 11px; font-weight: 600; }
      .col-type { fill: #64748b; font-family: monospace; font-size: 11px; }
      .col-name { fill: #0f172a; font-family: monospace; font-size: 11px; font-weight: 600; }
      .sec-title { fill: #0f172a; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; }
      .sec-sub { fill: #475569; font-family: system-ui, sans-serif; font-size: 12px; }
      .badge-curr { fill: #0284c7; rx: 4px; }
      .badge-prop { fill: #059669; rx: 4px; }
    </style>
  </defs>

  <rect width="980" height="540" class="bg" />

  <text x="35" y="38" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Modelo de Datos en PostgreSQL — Arquitectura Actual vs. Modelo Consolidado</text>
  <text x="35" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Análisis de la persistencia de telemetría sensorial en PostgreSQL (sensors_db) y hoja de ruta de evolución</text>

  <!-- LEFT: CURRENT MODEL (8 TABLES) -->
  <rect x="35" y="80" width="445" height="430" class="side-box" />
  <rect x="50" y="95" width="130" height="22" class="badge-curr" />
  <text x="115" y="110" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">IMPLEMENTACIÓN V1</text>
  <text x="50" y="138" class="sec-title">Esquema Actual: 8 Tablas Especializadas</text>
  <text x="50" y="156" class="sec-sub">Una tabla independiente por cada magnitud física sensada</text>

  <!-- Table 1: volt_panel (Representative) -->
  <rect x="50" y="175" width="195" height="110" class="tbl-body" />
  <rect x="50" y="175" width="195" height="26" class="tbl-head tbl-head-curr" />
  <text x="147" y="193" class="head-title">volt_panel (y 7 tablas más)</text>
  <text x="60" y="218" class="col-pk">PK  id</text><text x="125" y="218" class="col-type">SERIAL</text>
  <text x="60" y="238" class="col-idx">IDX timestamp</text><text x="160" y="238" class="col-type">TIMESTAMP</text>
  <text x="60" y="258" class="col-name">    value</text><text x="125" y="258" class="col-type">FLOAT (V)</text>
  <text x="60" y="276" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">Índice: idx_volt_panel_timestamp</text>

  <!-- List of the 8 tables -->
  <rect x="255" y="175" width="210" height="150" class="tbl-body" />
  <text x="268" y="196" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Métricas Registradas:</text>
  <text x="268" y="216" class="col-name">• volt_panel (V)</text>
  <text x="268" y="233" class="col-name">• amp_panel (A)</text>
  <text x="268" y="250" class="col-name">• temp_panel (°C)</text>
  <text x="268" y="267" class="col-name">• volt_bat (V)</text>
  <text x="268" y="284" class="col-name">• amp_bat (A)</text>
  <text x="268" y="301" class="col-name">• temp_bat (°C)</text>
  <text x="268" y="318" class="col-name">• volt_load (V) · amp_load</text>

  <!-- Current Architecture Justification -->
  <rect x="50" y="335" width="415" height="160" fill="#0f172a" rx="8" stroke="#334155" />
  <text x="65" y="358" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Justificación Técnica del Modelo Actual:</text>
  <text x="65" y="378" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Desacoplamiento de sensores: lecturas no bloqueantes en caso de</text>
  <text x="75" y="394" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">desconexión física de un transductor (ej. termocupla desconectada).</text>
  <text x="65" y="412" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Compatibilidad nativa directa con Grafana Time-Series Panels sin</text>
  <text x="75" y="428" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">requerir complejas desanidaciones SQL en dashboards.</text>
  <text x="65" y="446" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Eficiencia de compresión de series temporales independientes.</text>
  <text x="65" y="464" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Exportación RAW CSV granular por variable desde Flask Web.</text>

  <!-- RIGHT: PROPOSED CONSOLIDATED MODEL -->
  <rect x="500" y="80" width="445" height="430" class="side-box" />
  <rect x="515" y="95" width="145" height="22" class="badge-prop" />
  <text x="587" y="110" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PROPUESTA DE EVOLUCIÓN</text>
  <text x="515" y="138" class="sec-title">Modelo Consolidado: measurements</text>
  <text x="515" y="156" class="sec-sub">Una sola fila por trama de telemetría sincrónica emitida por el MCU</text>

  <!-- Table: measurements -->
  <rect x="515" y="175" width="415" height="210" class="tbl-body" />
  <rect x="515" y="175" width="415" height="26" class="tbl-head tbl-head-prop" />
  <text x="722" y="193" class="head-title">measurements (Esquema Unificado)</text>

  <text x="530" y="218" class="col-pk">PK  id</text><text x="640" y="218" class="col-type">BIGSERIAL</text><text x="760" y="218" class="col-sub" fill="#64748b">Identificador único</text>
  <text x="530" y="236" class="col-idx">IDX timestamp</text><text x="640" y="236" class="col-type">TIMESTAMPTZ</text><text x="760" y="236" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Estampa sincronizada</text>
  <text x="530" y="254" class="col-name">    volt_panel, amp_panel</text><text x="700" y="254" class="col-type">FLOAT</text><text x="760" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Generación solar</text>
  <text x="530" y="272" class="col-name">    temp_panel</text><text x="700" y="272" class="col-type">FLOAT</text><text x="760" y="272" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Condición ambiente</text>
  <text x="530" y="290" class="col-name">    volt_bat, amp_bat</text><text x="700" y="290" class="col-type">FLOAT</text><text x="760" y="290" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Batería 3S2P</text>
  <text x="530" y="308" class="col-name">    temp_bat</text><text x="700" y="308" class="col-type">FLOAT</text><text x="760" y="308" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Protección térmica</text>
  <text x="530" y="326" class="col-name">    volt_load, amp_load</text><text x="700" y="326" class="col-type">FLOAT</text><text x="760" y="326" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Bus y consumo</text>
  <text x="530" y="344" class="col-name">    mode_ems</text><text x="700" y="344" class="col-type">VARCHAR(16)</text><text x="760" y="344" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Estado FSM activo</text>
  <text x="530" y="362" class="col-name">    pwm_panel, pwm_bat</text><text x="700" y="362" class="col-type">INT</text><text x="760" y="362" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Ciclos de trabajo</text>

  <!-- Proposed Model Benefits -->
  <rect x="515" y="400" width="415" height="95" fill="#0f172a" rx="8" stroke="#334155" />
  <text x="530" y="420" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ventajas del Modelo Consolidado:</text>
  <text x="530" y="438" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Inserción atómica en una sola transacción INSERT (menor overhead SQL).</text>
  <text x="530" y="455" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Correlación perfecta de eventos instantáneos en la misma marca de tiempo.</text>
  <text x="530" y="472" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Registro del estado operativo de control (`mode`) y PWMs en la misma tabla.</text>
</svg>
