<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .state-box { rx: 12px; stroke-width: 2px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .state-mppt { fill: #fffbeb; stroke: #d97706; }
      .state-bat { fill: #eff6ff; stroke: #2563eb; }
      .state-low { fill: #fef2f2; stroke: #dc2626; }
      .state-trans { fill: #faf5ff; stroke: #9333ea; stroke-dasharray: 4 3; stroke-width: 1.5; }
      .title-text { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; }
      .sub-text { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .code-pill { rx: 4px; }
      .code-text { font-family: monospace; font-size: 11px; font-weight: 600; }
      .trans-line { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .trans-crit { stroke: #dc2626; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .trans-rec { stroke: #16a34a; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .cond-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .cond-text { fill: #0f172a; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-rec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="920" height="540" class="bg" />

  <text x="35" y="38" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Máquina de Estados Finita del Firmware EMS (STM32)</text>
  <text x="35" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Gestión de transiciones energéticas con tiempo muerto (Deadtime = 500 ms) y prioridades de protección</text>

  <!-- Deadtime Global Note -->
  <rect x="330" y="80" width="260" height="32" rx="6" class="state-trans" />
  <text x="460" y="101" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEADTIME ACTIVO: 500 ms (PWMs = 0)</text>

  <!-- State 1: PANEL_MPPT -->
  <rect x="50" y="140" width="280" height="180" class="state-box state-mppt" />
  <text x="70" y="172" class="title-text" fill="#78350f">MODE_PANEL_MPPT</text>
  <text x="70" y="195" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Fuente Principal: Solar PV</text>
  <text x="70" y="220" class="sub-text">• Boost activo (PWM PA3 @ 80 kHz)</text>
  <text x="70" y="238" class="sub-text">• Algoritmo P&amp;O modificado activo</text>
  <text x="70" y="256" class="sub-text">• Regulación de Bus ≤ 24.0 V</text>
  <text x="70" y="274" class="sub-text">• Convertidor Batería: PWM = 0</text>
  <rect x="70" y="286" width="145" height="20" class="code-pill" fill="#fef3c7" />
  <text x="75" y="300" class="code-text" fill="#92400e">Estado inicial / Arranque</text>

  <!-- State 2: BAT_CV -->
  <rect x="590" y="140" width="280" height="180" class="state-box state-bat" />
  <text x="610" y="172" class="title-text" fill="#1e3a8a">MODE_BAT_CV</text>
  <text x="610" y="195" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Fuente de Respaldo: Batería</text>
  <text x="610" y="220" class="sub-text">• Buck activo (PWM PA6 @ 50 kHz)</text>
  <text x="610" y="238" class="sub-text">• Regulación CV en Bus: [17.8 - 18.2 V]</text>
  <text x="610" y="256" class="sub-text">• Convertidor Panel: PWM = 0</text>
  <text x="610" y="274" class="sub-text">• Supervisión térmica MAX6675</text>
  <rect x="610" y="286" width="165" height="20" class="code-pill" fill="#dbeafe" />
  <text x="615" y="300" class="code-text" fill="#1e40af">Compensación de déficit</text>

  <!-- Transitions MPPT <-> BAT -->
  <!-- MPPT -> BAT -->
  <path d="M 330 190 L 590 190" class="trans-line" marker-end="url(#arr)" />
  <rect x="360" y="165" width="200" height="24" class="cond-box" />
  <text x="460" y="181" class="cond-text">Vbus &lt; 16.0 V AND temp_ok</text>

  <!-- BAT -> MPPT -->
  <path d="M 590 260 L 330 260" class="trans-line" marker-end="url(#arr)" />
  <rect x="350" y="235" width="220" height="24" class="cond-box" />
  <text x="460" y="251" class="cond-text">Vbus &gt; 17.5 V (hold 2s) OR T ≥ 60°C</text>

  <!-- State 3: LOW_BAT -->
  <rect x="320" y="380" width="280" height="130" class="state-box state-low" />
  <text x="340" y="410" class="title-text" fill="#991b1b">MODE_LOW_BAT</text>
  <text x="340" y="430" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Protección por Batería Agotada</text>
  <text x="340" y="452" class="sub-text">• Todos los PWM desactivados (0%)</text>
  <text x="340" y="470" class="sub-text">• Previene descarga profunda de celdas</text>
  <text x="340" y="488" class="sub-text">• Espera recarga hasta VBAT_RECOVER</text>

  <!-- Transitions to LOW_BAT -->
  <path d="M 190 320 L 190 445 L 320 445" class="trans-crit" marker-end="url(#arr-crit)" />
  <text x="245" y="435" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Vbat ≤ 9.50 V</text>

  <path d="M 730 320 L 730 445 L 600 445" class="trans-crit" marker-end="url(#arr-crit)" />
  <text x="665" y="435" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Vbat ≤ 9.50 V</text>

  <!-- Recovery from LOW_BAT to MPPT -->
  <path d="M 460 380 L 460 340 L 120 340 L 120 320" class="trans-rec" marker-end="url(#arr-rec)" />
  <rect x="200" y="350" width="180" height="22" class="cond-box" />
  <text x="290" y="365" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Recuperación: Vbat ≥ 10.20 V</text>
</svg>
