<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .box { rx: 10px; stroke-width: 2px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .box-hw { fill: #eff6ff; stroke: #2563eb; }
      .box-comm { fill: #f0fdfa; stroke: #0d9488; }
      .box-db { fill: #f0f9ff; stroke: #0284c7; }
      .box-vis { fill: #fff7ed; stroke: #ea580c; }
      .title-text { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .sub-text { fill: #475569; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .badge { fill: #e2e8f0; rx: 4px; }
      .badge-text { fill: #0f172a; font-family: monospace; font-size: 11px; font-weight: 600; }
      .arrow { stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrow-highlight { stroke: #0284c7; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 4; fill: none; }
      .arrow-head { fill: #64748b; }
      .arrow-head-hl { fill: #0284c7; }
      .container-title { fill: #334155; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .group-bg { fill: rgba(241, 245, 249, 0.6); stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
    <marker id="arrow-hl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head-hl" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="380" class="bg" />

  <!-- Diagram Title Header -->
  <text x="30" y="36" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Flujo Integral de Datos y Telemetría — Sistema EMS</text>
  <text x="30" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Desde la adquisición sensorial en microsegundos hasta la visualización en tiempo real</text>

  <!-- Group 1: Hardware & Sensórica -->
  <rect x="30" y="80" width="200" height="260" class="group-bg" />
  <text x="45" y="105" class="container-title">1. HARDWARE / MCU</text>
  
  <rect x="45" y="125" width="170" height="70" class="box box-hw" />
  <text x="58" y="150" class="title-text">Sensores Analógicos</text>
  <text x="58" y="168" class="sub-text">INA226 (I2C) · ACS712 (ADC)</text>
  <text x="58" y="184" class="sub-text">MAX6675 (SPI) Termocupla K</text>

  <rect x="45" y="215" width="170" height="85" class="box box-hw" />
  <text x="58" y="240" class="title-text">STM32F103 (Firmware)</text>
  <text x="58" y="258" class="sub-text">Muestreo @ 200 ms</text>
  <text x="58" y="274" class="sub-text">Genera trama JSON @ 1 Hz</text>
  <rect x="58" y="282" width="70" height="15" class="badge" />
  <text x="63" y="293" class="badge-text">115200 baud</text>

  <path d="M 130 195 L 130 215" class="arrow" marker-end="url(#arrow)" />

  <!-- Group 2: Enlace Serial / Adquisición -->
  <rect x="260" y="80" width="220" height="260" class="group-bg" />
  <text x="275" y="105" class="container-title">2. ADQUISICIÓN SERIAL</text>

  <rect x="275" y="125" width="190" height="55" class="box box-comm" />
  <text x="288" y="148" class="title-text">Conversor USB-TTL</text>
  <text x="288" y="166" class="sub-text">CH340 / CP2102 (UART→USB)</text>

  <rect x="275" y="200" width="190" height="60" class="box box-comm" />
  <text x="288" y="222" class="title-text">Web Serial API</text>
  <text x="288" y="240" class="sub-text">Modo Web (Navegador)</text>
  <text x="288" y="253" class="sub-text">POST /api/serial-data</text>

  <rect x="275" y="270" width="190" height="55" class="box box-comm" />
  <text x="288" y="292" class="title-text">serial_reader.py</text>
  <text x="288" y="310" class="sub-text">Modo Script (pySerial directo)</text>

  <!-- Connectors MCU -> USB -> Methods -->
  <path d="M 215 257 L 275 152" class="arrow" marker-end="url(#arrow)" />
  <path d="M 370 180 L 370 200" class="arrow" marker-end="url(#arrow)" />
  <path d="M 370 180 L 370 270" class="arrow" marker-end="url(#arrow)" />

  <!-- Group 3: Almacenamiento y Backend -->
  <rect x="510" y="80" width="230" height="260" class="group-bg" />
  <text x="525" y="105" class="container-title">3. BACKEND (DOCKER)</text>

  <rect x="525" y="125" width="200" height="65" class="box box-db" />
  <text x="538" y="148" class="title-text">Flask REST API :5000</text>
  <text x="538" y="166" class="sub-text">Recepciona JSON web</text>
  <text x="538" y="180" class="sub-text">Exporta RAW CSV</text>

  <rect x="525" y="210" width="200" height="115" class="box box-db" />
  <text x="538" y="235" class="title-text">PostgreSQL (sensors_db)</text>
  <text x="538" y="253" class="sub-text">Puerto 5432 · Red solar_net</text>
  <text x="538" y="271" class="sub-text">8 Tablas de series temporales:</text>
  <text x="538" y="287" class="badge-text">volt_*, amp_*, temp_*</text>
  <text x="538" y="305" class="sub-text">Índices B-Tree en timestamp</text>

  <path d="M 465 230 L 525 157" class="arrow" marker-end="url(#arrow)" />
  <path d="M 625 190 L 625 210" class="arrow" marker-end="url(#arrow)" />
  <path d="M 465 297 L 525 270" class="arrow" marker-end="url(#arrow)" />

  <!-- Group 4: Visualización y Análisis -->
  <rect x="770" y="80" width="200" height="260" class="group-bg" />
  <text x="785" y="105" class="container-title">4. VISUALIZACIÓN</text>

  <rect x="785" y="125" width="170" height="95" class="box box-vis" />
  <text x="798" y="150" class="title-text">Grafana :3000</text>
  <text x="798" y="168" class="sub-text">Datasource PostgreSQL</text>
  <text x="798" y="184" class="sub-text">Dashboard autoprovisionado</text>
  <text x="798" y="200" class="sub-text">Curvas P, V, I y T° en vivo</text>

  <rect x="785" y="240" width="170" height="85" class="box box-vis" />
  <text x="798" y="265" class="title-text">Exportación CSV</text>
  <text x="798" y="283" class="sub-text">Inspección de datos Grafana</text>
  <text x="798" y="299" class="sub-text">API Flask /api/download</text>
  <text x="798" y="315" class="sub-text">Para análisis en Python/MATLAB</text>

  <path d="M 725 250 L 785 172" class="arrow-highlight" marker-end="url(#arrow-hl)" />
  <path d="M 725 290 L 785 282" class="arrow" marker-end="url(#arrow)" />
</svg>
