<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .box { rx: 10px; stroke-width: 2px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .box-pv { fill: #fffbeb; stroke: #d97706; }
      .box-conv { fill: #f8fafc; stroke: #0284c7; }
      .box-bidir { fill: #f8fafc; stroke: #475569; }
      .box-bat { fill: #eff6ff; stroke: #2563eb; }
      .box-load { fill: #f0fdf4; stroke: #16a34a; }
      .box-sensor { fill: #faf5ff; stroke: #9333ea; rx: 8px; stroke-width: 1.5px; }
      .title-text { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .sub-text { fill: #475569; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle; }
      .sens-title { fill: #581c87; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .sens-sub { fill: #7e22ce; font-family: monospace; font-size: 10px; text-anchor: middle; }
      .bus-line { stroke: #0284c7; stroke-width: 5; stroke-linecap: round; }
      .power-pos { stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
      .sensor-tap { stroke: #9333ea; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .arrow-p { fill: #dc2626; }
      .arrow-s { fill: #9333ea; }
    </style>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-p" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-s" />
    </marker>
  </defs>

  <rect width="960" height="460" class="bg" />

  <!-- Title Header -->
  <text x="35" y="38" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Arquitectura de Hardware y Potencia — Bus DC Central</text>
  <text x="35" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Topología de acoplamiento en Bus común de 24 V, convertidores de potencia e instrumentación distribuida</text>

  <!-- Bus DC 24V Central Line -->
  <path d="M 400 130 L 760 130" class="bus-line" />
  <rect x="480" y="88" width="165" height="32" rx="6" fill="#0284c7" />
  <text x="562" y="109" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">BUS DC CENTRAL 24 V</text>

  <!-- 1. Panel Fotovoltaico -->
  <rect x="35" y="100" width="160" height="100" class="box box-pv" />
  <text x="115" y="135" class="title-text" fill="#78350f">Panel Solar (PV)</text>
  <text x="115" y="155" class="sub-text">Potencia: 50 W</text>
  <text x="115" y="172" class="sub-text">Vmp: 17 V · Voc: 22.7 V</text>
  <text x="115" y="189" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fuente Principal</text>

  <!-- Sensor PV Node -->
  <rect x="150" y="240" width="120" height="50" class="box-sensor" />
  <text x="210" y="260" class="sens-title">Medición V / I</text>
  <text x="210" y="278" class="sens-sub">INA226 + ACS712</text>
  <path d="M 210 240 L 210 150" class="sensor-tap" marker-end="url(#arr-s)" />

  <!-- 2. Convertidor Boost MPPT -->
  <rect x="250" y="100" width="150" height="100" class="box box-conv" />
  <text x="325" y="132" class="title-text">Convertidor Boost</text>
  <text x="325" y="150" class="sub-text">Elevador (17V → 24V)</text>
  <text x="325" y="168" class="sub-text">PWM @ 80 kHz</text>
  <text x="325" y="186" fill="#0284c7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Control P&amp;O MPPT</text>

  <!-- Power Line PV to Boost -->
  <path d="M 195 150 L 250 150" class="power-pos" marker-end="url(#arr-p)" />
  <!-- Boost to Bus -->
  <path d="M 400 150 L 450 150 L 450 130" class="power-pos" />

  <!-- 3. Convertidor Buck-Boost Bidireccional -->
  <rect x="460" y="210" width="200" height="95" class="box box-bidir" />
  <text x="560" y="240" class="title-text">Convertidor Buck-Boost</text>
  <text x="560" y="258" class="sub-text">Bidireccional (24V ↔ 12V)</text>
  <text x="560" y="275" class="sub-text">• Buck: Carga CC/CV @ 50 kHz</text>
  <text x="560" y="291" class="sub-text">• Boost: Respaldo de Bus</text>

  <!-- Bus to Bidirectional Converter -->
  <path d="M 560 130 L 560 210" class="power-pos" />

  <!-- 4. Batería Li-Ion -->
  <rect x="475" y="345" width="170" height="95" class="box box-bat" />
  <text x="560" y="375" class="title-text" fill="#1e3a8a">Batería Li-Ion</text>
  <text x="560" y="393" class="sub-text">12 V nominal (3S2P)</text>
  <text x="560" y="410" class="sub-text">5200 mAh · Perfil CC/CV</text>
  <text x="560" y="427" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Respaldo Dinámico</text>

  <!-- Sensor Batería Node -->
  <rect x="680" y="345" width="125" height="60" class="box-sensor" />
  <text x="742" y="365" class="sens-title">Medición V / I / T°</text>
  <text x="742" y="382" class="sens-sub">INA226 + ACS712</text>
  <text x="742" y="397" class="sens-sub">MAX6675 (Termocupla)</text>
  <path d="M 680 375 L 645 375" class="sensor-tap" marker-end="url(#arr-s)" />

  <!-- Bidirectional Line between Buck-Boost and Battery -->
  <path d="M 560 305 L 560 345" class="power-pos" />

  <!-- 5. Sensor Carga Node -->
  <rect x="655" y="160" width="115" height="48" class="box-sensor" />
  <text x="712" y="180" class="sens-title">Medición V / I</text>
  <text x="712" y="196" class="sens-sub">INA226 + ACS712</text>
  <path d="M 712 160 L 712 130" class="sensor-tap" marker-end="url(#arr-s)" />

  <!-- 6. Carga Resistiva -->
  <rect x="760" y="90" width="170" height="110" class="box box-load" />
  <text x="845" y="130" class="title-text" fill="#14532d">Carga de Ensayos</text>
  <text x="845" y="150" class="sub-text">Resistencia Calibrada 15 Ω</text>
  <text x="845" y="168" class="sub-text">P = 15 W · 20 W · 25 W</text>
  <text x="845" y="186" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Suministro Ininterrumpido</text>
</svg>
