#    depends_on:
#      postgres:
#        condition: service_healthy
#    networks:
#      - solar_net
#    restart: unless-stopped

  grafana:
    image: ${DOCKER_USERNAME:-tobiaslozano}/ems-grafana:latest
    container_name: solar_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
    networks:
      - solar_net
    restart: unless-stopped

  web_app:
    image: ${DOCKER_USERNAME:-tobiaslozano}/ems-webapp:latest
    container_name: solar_webapp
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sensors_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solar_net
    restart: unless-stopped

  docs:
    image: ${DOCKER_USERNAME:-tobiaslozano}/ems-docs:latest
    container_name: solar_docs
    ports:
      - "8080:80"
    networks:
      - solar_net
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:

networks:
  solar_net:
    driver: bridge
