<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema EMS - Microgrid DC</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-color: #0A0D14;
            --surface-color: #131722;
            --border-color: #2A2F3D;
            --text-main: #F3F4F6;
            --text-muted: #8B949E;
            --accent-cyan: #00F0FF;
            --accent-amber: #FFB000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, .card-header, .stat-value {
            font-family: 'Space Grotesk', sans-serif;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .topbar {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
        }
        .topbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            box-shadow: none;
            transition: border-color 0.2s ease;
        }
        .card:hover {
            border-color: var(--accent-cyan);
            transform: none;
            box-shadow: none;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-radius: 0 !important;
            padding: 0.75rem 1rem;
        }
        .stat-value {
            font-size: 1.5rem;
            color: var(--text-main);
        }
        .btn-primary {
            background-color: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 2px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--accent-amber);
            color: var(--accent-amber);
            border-radius: 2px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .btn-danger:hover {
            background-color: rgba(255, 176, 0, 0.1);
            color: var(--accent-amber);
            border-color: var(--accent-amber);
        }
        .form-control {
            background-color: var(--bg-color) !important;
            border: 1px solid var(--border-color);
            color: var(--text-main) !important;
            border-radius: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .form-control:focus {
            border-color: var(--accent-cyan);
            box-shadow: none;
        }
        .badge {
            border-radius: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: normal;
        }
        .badge.bg-secondary {
            background-color: var(--border-color) !important;
            color: var(--text-muted);
        }
        .badge.bg-success {
            background-color: transparent !important;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }
        
        /* Terminal / Console Styles */
        #serial-log {
            background-color: #050608 !important;
            border: 1px solid var(--border-color);
            color: var(--accent-cyan) !important;
            border-radius: 2px;
        }
        
        /* Signature Element Animation */
        .pulse-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border-color);
            display: inline-block;
            margin-right: 8px;
        }
        .pulse-indicator.active {
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        .pulse-anim {
            animation: pulse-flash 0.3s ease-out;
        }
        @keyframes pulse-flash {
            0% { box-shadow: 0 0 15px var(--accent-cyan); background-color: #fff; }
            100% { box-shadow: 0 0 8px var(--accent-cyan); background-color: var(--accent-cyan); }
        }
        
        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
            margin-left: 1rem;
        }
    </style>
</head>
<body>

    <div class="topbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <a class="topbar-brand" href="#">
                <i class="bi bi-cpu-fill" style="color: var(--accent-cyan);"></i> EMS_MICROGRID
            </a>
            <span class="badge bg-secondary">v1.0.0</span>
        </div>
        <div>
            <a id="grafana-link" href="#" class="btn btn-primary btn-sm py-1 px-2" target="_blank" style="font-size: 0.65rem;">
                <i class="bi bi-graph-up"></i> TELEMETRY_UI (GRAFANA)
            </a>
        </div>
    </div>

    <div class="container-fluid px-4 py-4 mb-5">
        
        <h2 class="section-title">Enlace de Adquisición de Datos (DAQ)</h2>
        <!-- Serial Connection UI -->
        <div class="card mb-5 border-0" style="border-top: 2px solid var(--accent-cyan) !important;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Interfaz Serial Local</span>
                <div class="d-flex align-items-center">
                    <div id="data-pulse" class="pulse-indicator"></div>
                    <span id="serial-status" class="mono text-muted" style="font-size: 0.75rem;">OFFLINE</span>
                </div>
            </div>
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-4 mb-3 mb-md-0">
                        <p class="text-muted small mb-3" style="font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;">
                            > ESPERANDO_CONEXION_USB<br>
                            > REQ:_CONTEXTO_SEGURO (HTTPS/LOCAL)
                        </p>
                        <button id="btn-connect-serial" class="btn btn-primary w-100 mb-2">
                            <i class="bi bi-usb-symbol me-2"></i> Inicializar Enlace Serial
                        </button>
                        <button id="btn-disconnect-serial" class="btn btn-danger w-100 d-none">
                            <i class="bi bi-x-circle me-2"></i> Cortar Enlace
                        </button>
                    </div>
                    <div class="col-md-8">
                        <div id="serial-log" class="text-start p-3 small mono" style="height: 120px; overflow-y: auto; display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <h2 class="section-title">Nodos de Almacenamiento (PostgreSQL)</h2>
        
        <div id="loading" class="my-5 d-flex justify-content-center">
            <div class="spinner-border" style="color: var(--accent-cyan); width: 2rem; height: 2rem;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <div id="error-container" class="alert alert-danger d-none rounded-0 border-0 border-start border-danger border-4" style="background-color: rgba(255,0,0,0.1); color: #ff6b6b;" role="alert">
        </div>

        <div class="row g-4" id="tables-container">
            <!-- Cards will be injected here via JS -->
        </div>

    </div>

    <footer class="text-center mt-5 py-3 border-top border-secondary">
        <small class="text-muted">Desarrollado por <a href="https://github.com/TobiasLozano" target="_blank" class="text-info text-decoration-none">Tobias Lozano</a></small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.css" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar el link de Grafana de manera dinámica para Producción
            const grafanaLink = document.getElementById('grafana-link');
            if (grafanaLink) {
                grafanaLink.href = window.location.protocol + '//' + window.location.hostname + ':3000';
            }
            
            fetchTables();
        });

        async function fetchTables() {
            const container = document.getElementById('tables-container');
            const loading = document.getElementById('loading');
            const errorContainer = document.getElementById('error-container');

            try {
                const response = await fetch('/api/tables');
                if (!response.ok) {
                    throw new Error(`Error de servidor: ${response.status}`);
                }
                const tables = await response.json();
                
                loading.classList.add('d-none');
                
                if (tables.length === 0) {
                    errorContainer.textContent = "No se encontraron tablas de datos.";
                    errorContainer.classList.remove('d-none');
                    return;
                }

                tables.forEach(table => {
                    const card = createTableCard(table);
                    container.appendChild(card);
                });

            } catch (error) {
                loading.classList.add('d-none');
                errorContainer.textContent = "No se pudo cargar la información de las tablas: " + error.message;
                errorContainer.classList.remove('d-none');
            }
        }

        function createTableCard(table) {
            const col = document.createElement('div');
            col.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
            
            const friendlyName = table.name.toUpperCase().replace(/_/g, ' ');

            const end = new Date();
            const start = new Date(end.getTime() - (24 * 60 * 60 * 1000));
            
            const startStr = start.toISOString().slice(0, 19).replace('T', ' ');
            const endStr = end.toISOString().slice(0, 19).replace('T', ' ');

            col.innerHTML = `
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span style="color: var(--text-main);">${friendlyName}</span>
                        <span class="badge bg-secondary mono">${table.name}</span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-3" style="border-color: var(--border-color) !important;">
                            <div class="w-50">
                                <div class="text-muted mb-1" style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;">Filas</div>
                                <div class="stat-value mono" style="color: var(--accent-cyan);">${table.row_count.toLocaleString()}</div>
                            </div>
                            <div class="text-end w-50">
                                <div class="text-muted mb-1" style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;">Tamaño</div>
                                <div class="stat-value mono" style="color: var(--text-main);">${table.size}</div>
                            </div>
                        </div>

                        <form onsubmit="downloadData(event, '${table.name}')" class="mt-3">
                            <div class="d-flex justify-content-between align-items-end mb-2">
                                <label class="form-label text-muted mb-0" style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;">Ventana de Extracción</label>
                                <button type="button" class="btn btn-link btn-sm py-0 px-0 text-decoration-none" style="color: var(--accent-amber); font-size: 0.7rem;" onclick="pasteGrafanaRange('${table.name}')" title="Pegar JSON de Grafana">
                                    <i class="bi bi-clipboard"></i> INYECTAR GRAFANA_JSON
                                </button>
                            </div>
                            <div class="mb-2">
                                <input type="text" class="form-control form-control-sm" id="start-${table.name}" value="${startStr}" placeholder="INICIO (YYYY-MM-DD HH:mm:ss)" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control form-control-sm" id="end-${table.name}" value="${endStr}" placeholder="FIN (YYYY-MM-DD HH:mm:ss)" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-download me-1"></i> EXPORTAR RAW (.CSV)
                            </button>
                        </form>
                    </div>
                </div>
            `;
            return col;
        }

        function downloadData(event, tableName) {
            event.preventDefault();
            const startInput = document.getElementById(`start-${tableName}`).value;
            const endInput = document.getElementById(`end-${tableName}`).value;
            
            if (!startInput || !endInput) {
                alert("Por favor selecciona ambas fechas.");
                return;
            }

            // Convert local datetime input to UTC or keep as local
            // Postgres timestamp generally accepts this format directly: YYYY-MM-DDTHH:mm
            const start = startInput.replace('T', ' ');
            const end = endInput.replace('T', ' ');

            const url = `/api/download/${tableName}?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
            
            // Create a temporary link to trigger download
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function pasteGrafanaRange(tableName) {
            try {
                const text = await navigator.clipboard.readText();
                if (!text) return;
                
                // Attempt to parse JSON
                let data = null;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    alert("El texto en el portapapeles no parece ser un JSON válido de Grafana.\\n\\nCopia algo como: {\\\"from\\\":\\\"...\\\",\\\"to\\\":\\\"...\\\"}");
                    return;
                }

                if (data && data.from && data.to) {
                    // Limpiamos un poco el formato para que sea más amigable
                    const formatGrafanaTime = (timeStr) => {
                        return timeStr.replace('T', ' ').replace('Z', '');
                    };

                    document.getElementById(`start-${tableName}`).value = formatGrafanaTime(data.from);
                    document.getElementById(`end-${tableName}`).value = formatGrafanaTime(data.to);
                } else {
                    alert("El JSON copiado no contiene las propiedades 'from' y 'to'.");
                }
            } catch (err) {
                console.error("Failed to read clipboard contents: ", err);
                alert("No se pudo leer el portapapeles. Es posible que el navegador haya bloqueado el acceso o que necesites dar permisos.");
            }
        }

        // Web Serial API Logic
        let port;
        let reader;
        let inputDone;
        let inputStream;
        
        const btnConnect = document.getElementById('btn-connect-serial');
        const btnDisconnect = document.getElementById('btn-disconnect-serial');
        const serialStatus = document.getElementById('serial-status');
        const serialLog = document.getElementById('serial-log');
        const dataPulse = document.getElementById('data-pulse');
        
        btnConnect.addEventListener('click', async () => {
            if ('serial' in navigator) {
                try {
                    port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 9600 });
                    
                    // Forzar señales DTR y RTS para despertar placas Arduino/ESP32
                    if (port.setSignals) {
                        await port.setSignals({ dataTerminalReady: true, requestToSend: true });
                    }
                    
                    serialStatus.textContent = 'ONLINE_9600_BAUD';
                    serialStatus.style.color = 'var(--accent-cyan)';
                    dataPulse.classList.add('active');
                    btnConnect.classList.add('d-none');
                    btnDisconnect.classList.remove('d-none');
                    serialLog.style.display = 'block';
                    serialLog.innerHTML = '<div>> CONEXION_ESTABLECIDA...</div>';
                    
                    readSerial();
                } catch (err) {
                    console.error('Error al conectar el puerto serial:', err);
                    alert('ERR_CONEXION: No se pudo abrir el puerto serial.');
                }
            } else {
                alert('ERR_COMPAT: La Web Serial API no está soportada (requiere Chrome/Edge + HTTPS).');
            }
        });
        
        btnDisconnect.addEventListener('click', async () => {
            if (reader) {
                await reader.cancel();
            }
            serialStatus.textContent = 'OFFLINE';
            serialStatus.style.color = '';
            dataPulse.classList.remove('active');
            btnConnect.classList.remove('d-none');
            btnDisconnect.classList.add('d-none');
        });
        
        function extractJson(line) {
            if (!line) return null;
            const limpia = line.replace(/\\0/g, '').trim();
            const ini = limpia.indexOf('{');
            const fin = limpia.lastIndexOf('}');
            if (ini === -1 || fin === -1 || fin <= ini) return null;
            return limpia.substring(ini, fin + 1);
        }
        
        async function readSerial() {
            const textDecoder = new TextDecoderStream();
            inputDone = port.readable.pipeTo(textDecoder.writable);
            inputStream = textDecoder.readable;
            reader = inputStream.getReader();
            
            let buffer = '';
            
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        // DEBUG EXTREMO: imprimir cada pedacito que llega antes de procesarlo
                        if (value.trim().length > 0) {
                            logSerialData(`> CHUNK: ${value.trim()}`);
                        }

                        buffer += value;
                        let lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep the incomplete line
                        
                        for (let line of lines) {
                            if (line.trim().length > 0) {
                                // Para ayudar a debugear si los datos están llegando sucios
                                logSerialData(`> DBG: ${line.trim()}`);
                            }

                            const jsonStr = extractJson(line);
                            if (jsonStr) {
                                try {
                                    const data = JSON.parse(jsonStr);
                                    logSerialData(`> RX_OK: ${jsonStr}`);
                                    sendDataToServer(data);
                                    triggerPulse();
                                } catch (e) {
                                    logSerialData(`> ERR_PARSE: ${jsonStr}`);
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("Error leyendo del serial:", error);
            } finally {
                reader.releaseLock();
                if (port) {
                    await port.close();
                }
            }
        }
        
        function triggerPulse() {
            dataPulse.classList.remove('pulse-anim');
            void dataPulse.offsetWidth; // trigger reflow
            dataPulse.classList.add('pulse-anim');
        }

        function logSerialData(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            serialLog.appendChild(div);
            serialLog.scrollTop = serialLog.scrollHeight;
            if (serialLog.childNodes.length > 50) {
                serialLog.removeChild(serialLog.firstChild);
            }
        }
        
        async function sendDataToServer(data) {
            try {
                await fetch('/api/serial-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                // Podríamos disparar un refetch de fetchTables() pero
                // para no saturar la red, lo dejamos para que el usuario refresque.
            } catch (err) {
                console.error('Error enviando datos al servidor:', err);
            }
        }
    </script>
</body>
</html>
