services:
  postgres:
    image: postgres:15-alpine
    container_name: solar_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sensors_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql_scripts/init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar_net
    restart: unless-stopped



  serial_reader:
    build:
      context: .
      dockerfile: backend/Dockerfile.reader
    container_name: solar_reader
    environment:
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyACM0}
      SERIAL_BAUDRATE: ${SERIAL_BAUDRATE:-9600}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sensors_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - solar_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: solar_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards
    depends_on:
      - postgres
    networks:
      - solar_net
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:

networks:
  solar_net:
    driver: bridge
